[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-update"
version = "2.0.4"
description = "Python bindings for the Astra Update library"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }

[project.scripts]
astra-boot-py = "astra_update.boot:main"

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
astra_update = ["*.pyd", "*.so", "*.dylib"]
