[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-update"
version = "2.0.0.dev0"
description = "Python bindings for the Astra Update library"
requires-python = ">=3.7"
license = { text = "Apache-2.0" }

[project.scripts]
astra-boot-py = "astra_update_boot:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["astra_update_boot"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astra_update = ["*.pyd", "*.so", "*.dylib"]
